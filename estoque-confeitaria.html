<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque · Confeitaria do Rei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3f2;--card:#fff;--ink:#2b1a11;--mut:#7a6a62;--brand:#3d2518;--brand-ink:#f6ece4;--gold:#b9803f;--ok:#4f7a4a;--warn:#b9803f;--bad:#b23a48;--line:#e4dcd7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a110c;--card:#261913;--ink:#f3e8e0;--mut:#b3a197;--brand:#120a06;--brand-ink:#f3e8e0;--gold:#d29b58;--ok:#8fbf86;--warn:#d29b58;--bad:#e2707d;--line:#3a2a21}}
:root[data-theme="dark"]{--bg:#1a110c;--card:#261913;--ink:#f3e8e0;--mut:#b3a197;--brand:#120a06;--brand-ink:#f3e8e0;--gold:#d29b58;--ok:#8fbf86;--warn:#d29b58;--bad:#e2707d;--line:#3a2a21}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--brand);color:var(--brand-ink);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:auto;filter:brightness(0) invert(.92)}
.brand b{font:800 18px/1.1 Fraunces,serif}.brand small{display:block;opacity:.7;font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:#ffffff14}nav button.on{background:var(--gold);color:#241508;font-weight:700}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav .n{background:var(--bad);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;opacity:.7}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{font-size:clamp(26px,4vw,38px);font-weight:800}
header.top p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h3{font-size:19px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:14px}
.stat.bad{border-left-color:var(--bad)}.stat.ok{border-left-color:var(--ok)}
.stat b{display:block;font:800 30px/1.1 Fraunces,serif}.stat span{color:var(--mut);font-size:14px}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:700}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid currentColor}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.bar{height:7px;border-radius:4px;background:var(--line);min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.low i{background:var(--bad)}
form.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut);font-weight:500}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:700 15px Figtree,sans-serif;border:0;border-radius:8px;padding:10px 16px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.gold{background:var(--gold);color:#241508}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alert:last-child{border:0}.empty{color:var(--mut);padding:8px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:10px;z-index:10}.brand small,.side-foot{display:none}nav{flex-direction:row}nav button{white-space:nowrap}.brand b{display:none}.brand img{width:34px}}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:30;overflow:auto;padding:12px}#ov.on{display:block}
.ovb{background:var(--card);border-radius:12px;padding:16px;max-width:520px;margin:4vh auto}
#lbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.et{border:1px dashed var(--mut);border-radius:6px;padding:6px;text-align:center;background:#fff;color:#000;font-size:13px}.et svg{width:100%;height:auto}.et b{display:block}
#rd video{border-radius:8px}
@media print{body *{visibility:hidden}#lbl,#lbl *{visibility:visible}#ov{position:static;background:none;overflow:visible;padding:0}.ovb{margin:0;padding:0}#lbl{position:absolute;left:0;top:0;width:100%;margin:0}.et{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const K='conf-estoque-v1', $=s=>document.querySelector(s);
const H=36e5, now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){const t=now();const P=(nome,cod,cat,un,min,tipo)=>({id:uid(),nome,cod,cat,un,min,tipo});
const p=[P('Farinha de trigo','7891000100','Secos','kg',10,'insumo'),P('Açúcar refinado','7891000101','Secos','kg',8,'insumo'),P('Manteiga sem sal','7891000102','Laticínios','kg',4,'insumo'),P('Leite integral','7891000103','Laticínios','L',12,'insumo'),P('Chocolate 50%','7891000104','Secos','kg',5,'insumo'),P('Ovos','7891000105','Frios','un',60,'insumo'),P('Café em grão','7891000106','Secos','kg',3,'insumo'),P('Brigadeiro gourmet','7891000200','Doces','un',20,'acabado'),P('Fatia bolo de cenoura','7891000201','Bolos','un',10,'acabado'),P('Pão francês','7891000202','Padaria','un',30,'acabado'),P('Salgado (coxinha)','7891000203','Salgados','un',20,'acabado')];
p.forEach((x,i)=>{x.preco=[0,0,0,0,0,0,0,6.5,9,.8,6][i];x.custo=[5,5,45,5,40,.8,55,2.2,3.5,.35,2.2][i]});
const L=(i,q,h,l)=>({id:uid(),pid:p[i].id,qtd:q,qini:q,val:t+h*H,local:l,entrada:t-48*H});
return{produtos:p,lotes:[L(0,18,24*120,'Seco'),L(1,6,24*200,'Seco'),L(2,3,24*20,'Refrigerado'),L(3,10,3,'Refrigerado'),L(3,8,24*5,'Refrigerado'),L(4,9,24*90,'Seco'),L(5,90,24*12,'Refrigerado'),L(6,5,24*150,'Seco'),L(7,14,20,'Refrigerado'),L(7,12,24*2,'Refrigerado'),L(8,4,-2,'Refrigerado'),L(9,60,36,'Seco'),L(10,24,48,'Refrigerado')],mov:[],receitas:[{id:uid(),pid:p[7].id,rend:20,itens:[{iid:p[4].id,q:.4},{iid:p[3].id,q:.4},{iid:p[2].id,q:.05},{iid:p[1].id,q:.1}]},{id:uid(),pid:p[8].id,rend:10,itens:[{iid:p[0].id,q:.5},{iid:p[1].id,q:.4},{iid:p[5].id,q:4},{iid:p[2].id,q:.1}]},{id:uid(),pid:p[9].id,rend:20,itens:[{iid:p[0].id,q:1},{iid:p[1].id,q:.02},{iid:p[2].id,q:.03}]},{id:uid(),pid:p[10].id,rend:20,itens:[{iid:p[0].id,q:.5},{iid:p[2].id,q:.05},{iid:p[3].id,q:.3},{iid:p[5].id,q:2}]}]}}
let D=(()=>{try{return JSON.parse(localStorage.getItem(K))||seed()}catch(e){return seed()}})();D.receitas=D.receitas||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)};
const prod=id=>D.produtos.find(p=>p.id===id);
const total=pid=>D.lotes.filter(l=>l.pid===pid&&l.qtd>0&&l.val>now()).reduce((s,l)=>s+l.qtd,0);
const fmtD=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtN=n=>(+n).toLocaleString('pt-BR',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function restante(t){const d=t-now();if(d<0)return'vencido';const h=d/H;return h<48?`${Math.floor(h)} h`:`${Math.floor(h/24)} dias`}
function alertas(){const a=[];
D.produtos.forEach(p=>{const t=total(p.id);if(t<=p.min)a.push({k:'baixo',sev:2,txt:`${p.nome}: ${fmtN(t)} ${p.un} em estoque (mínimo ${fmtN(p.min)})`})});
D.lotes.filter(l=>l.qtd>0).forEach(l=>{const p=prod(l.pid),h=(l.val-now())/H,t=`${p.nome} · ${fmtN(l.qtd)} ${p.un}`;
if(h<0)a.push({k:'vencido',sev:3,txt:`${t} vencido em ${fmtD(l.val)}`,lote:l.id});
else if(h<=4)a.push({k:'4h',sev:3,txt:`${t} vence em menos de 4 h`});
else if(h<=24)a.push({k:'24h',sev:1,txt:`${t} vence em menos de 24 h`})});
return a.sort((x,y)=>y.sev-x.sev)}
function mov(tipo,l,q,motivo){const p=prod(l.pid)||{};D.mov.unshift({id:uid(),tipo,pid:l.pid,lid:l.id,q,motivo:motivo||'',preco:p.preco||0,custo:p.custo||0,ts:now()})}
function baixaFEFO(pid,q,tipo,motivo){
if(total(pid)<q)return false;
let r=q;D.lotes.filter(l=>l.pid===pid&&l.qtd>0&&l.val>now()).sort((a,b)=>a.val-b.val).forEach(l=>{if(r<=0)return;const u=Math.min(l.qtd,r);l.qtd=+(l.qtd-u).toFixed(3);r-=u;mov(tipo,l,u,motivo)});
save();return true}

function tblLotes(ls){if(!ls.length)return'<div class="empty">Nenhum lote.</div>';
return`<div class="tbl"><table><tr><th>Produto</th><th>Saldo</th><th>Local</th><th>Validade</th><th>Vence em</th></tr>${ls.map(l=>{const p=prod(l.pid),h=(l.val-now())/H;return`<tr><td>${esc(p.nome)}</td><td>${fmtN(l.qtd)} ${p.un}</td><td>${l.local}</td><td>${fmtD(l.val)}</td><td><span class="tag ${h<0||h<=4?'bad':h<=24?'warn':'ok'}">${restante(l.val)}</span></td></tr>`}).join('')}</table></div>`}

const LB='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js',QR='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
const lib=src=>new Promise((ok,no)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
let scn=null;
function overlay(h){let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';document.body.appendChild(o)}o.innerHTML=`<div class="ovb">${h}<button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeOv()">Fechar</button></div>`;o.className='on'}
async function closeOv(){if(scn){try{await scn.stop()}catch(e){}scn=null}$('#ov').className=''}
async function scan(cb){overlay('<h3>Ler código de barras</h3><div id="rd" style="width:100%;margin-top:10px"></div><p class="empty">Aponte a câmera para o código.</p>');
try{await lib(QR);scn=new Html5Qrcode('rd');await scn.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w,340)*.9),height:Math.floor(Math.min(h,220)*.7)})},async t=>{await closeOv();cb(t)})}
catch(e){await closeOv();toast('Não foi possível abrir a câmera. Use o leitor ou digite o código.',1)}}
function porCodigo(c,f){c=String(c).trim();if(!c)return;const p=D.produtos.find(x=>x.cod===c);if(!p)return toast('Código '+c+' não cadastrado.',1);f.pid.value=p.id;toast(p.nome);f.q.focus()}

function etiqueta(id){const p=prod(id);overlay(`<h3>Etiqueta · ${esc(p.nome)}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><label>Cópias<input id="lc" type="number" min="1" max="30" value="6" onchange="gerar('${id}')"></label><label>Validade (opcional)<input id="lv" type="date" onchange="gerar('${id}')"></label></div><div id="lbl"></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="window.print()">Imprimir etiquetas</button>`);gerar(id)}

$('#lbl').querySelectorAll('svg').forEach(s=>JsBarcode(s,p.cod,{format:'CODE128',height:44,fontSize:13,margin:2,width:1.6}))}

const ready=()=>typeof cloud==='undefined'||!cloud||TOKEN;
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

{n:'Mousse de chocolate gelada',i:['chocolate','ovos','açúcar'],c:['quente']},
{n:'Sorvete cremoso de leite',i:['leite','açúcar'],c:['quente']},

{n:'Chocolate quente cremoso',i:['leite','chocolate','açúcar'],c:['frio','chuva']},

let CL={mode:'auto',t:null,cond:null,at:0};try{CL={...CL,...JSON.parse(localStorage.getItem('conf-clima'))}}catch(e){}
const saveCL=()=>{try{localStorage.setItem('conf-clima',JSON.stringify(CL))}catch(e){}};
function setClima(v){CL.mode=v;saveCL();render()}
async function loadClima(){if(now()-CL.at<18e5&&CL.t!=null)return;
try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,precipitation,weather_code&timezone=auto`);const c=(await r.json()).current;
CL.t=c.temperature_2m;CL.cond=(c.precipitation>0.1||c.weather_code>=51)?'chuva':c.temperature_2m>=26?'quente':c.temperature_2m<=18?'frio':'ameno';CL.at=now();saveCL();if(ready())render()}catch(e){}}
const climaAtual=()=>CL.mode!=='auto'?CL.mode:(CL.cond||'ameno');
const CLN={quente:'calor',ameno:'clima ameno',frio:'frio',chuva:'chuva'};
function climaTxt(){if(CL.mode!=='auto')return'Clima escolhido: '+CLN[CL.mode];return CL.t!=null?`Agora: ${Math.round(CL.t)} °C, ${CLN[CL.cond]}`:'Sem dados do clima; usando clima ameno. Escolha ao lado.'}
function sugestoes(){const cl=climaAtual(),exp={};
D.lotes.filter(l=>l.qtd>0&&l.val>now()&&(l.val-now())/H<=JANELA).forEach(l=>exp[l.pid]=1);
return REC.map(r=>{const ps=r.i.map(k=>({k,p:D.produtos.find(p=>nz(p.nome).includes(nz(k)))}));
return{r,usa:ps.filter(x=>x.p&&exp[x.p.id]),falta:ps.filter(x=>!x.p||total(x.p.id)<=0).map(x=>x.k),ok:r.c.includes(cl)}})
.filter(x=>x.usa.length&&x.falta.length<=1).sort((a,b)=>b.ok-a.ok||a.falta.length-b.falta.length||b.usa.length-a.usa.length).slice(0,4)}
function cardVenc(){const L=D.lotes.filter(l=>l.qtd>0&&l.val>now()&&(l.val-now())/H<=JANELA).sort((a,b)=>a.val-b.val),S=sugestoes();
return`<div class="card"><h3>Perto do vencimento (${JANELA} h)</h3>${L.length?tblLotes(L):'<div class="empty">Nenhum lote vence nos próximos 3 dias.</div>'}</div>
<div class="card"><h3>Sugestões de receita</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><span>${climaTxt()}</span><select aria-label="Clima" style="width:auto" onchange="setClima(this.value)">${[['auto','Clima automático'],['quente','Calor'],['ameno','Ameno'],['frio','Frio'],['chuva','Chuva']].map(([v,t])=>`<option value="${v}"${CL.mode===v?' selected':''}>${t}</option>`).join('')}</select></div>
${S.length?S.map(x=>`<div class="alert"><span><b>${x.r.n}</b> <span class="tag ${x.ok?'ok':'warn'}">${x.ok?'Combina com o clima':'Fora do clima'}</span><br><small style="color:var(--mut)">Aproveita: ${x.usa.map(u=>esc(u.p.nome)).join(', ')}.${x.falta.length?' Falta: '+x.falta.join(', ')+'.':''}</small></span></div>`).join(''):`<div class="empty">${L.length?'Nenhuma receita da lista usa esses itens.':'Sem itens perto do vencimento. Nada a aproveitar agora.'}</div>`}</div>`}

function exportarMeus(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meus-dados.json';a.click()}

const rec=pid=>(D.receitas||[]).find(r=>r.pid===pid);
const custoRec=r=>r.itens.reduce((s,i)=>s+i.q*((prod(i.iid)||{}).custo||0),0)/r.rend;
function baixaReceita(pid,n,obs){const r=rec(pid),p=prod(pid);if(!r)return'Este produto não tem receita.';
const falta=r.itens.map(i=>({p:prod(i.iid),need:i.q*n/r.rend})).filter(x=>x.p&&total(x.p.id)<x.need-1e-9);
if(falta.length)return'Falta de insumo: '+falta.map(x=>`${x.p.nome} (precisa ${fmtN(x.need)} ${x.p.un}, há ${fmtN(total(x.p.id))})`).join('; ');
r.itens.forEach(i=>baixaFEFO(i.iid,+(i.q*n/r.rend).toFixed(3),'producao','Receita: '+p.nome+' x'+n+(obs?' - '+obs:'')));
mov('venda',{pid,id:''},n,'Receita'+(obs?' - '+obs:''));D.mov[0].custo=+custoRec(r).toFixed(2);save();return''}
function baixaRec(e){e.preventDefault();const f=new FormData(e.target),m=baixaReceita(f.get('pid'),+f.get('q'),f.get('obs'));if(m)return toast(m,1);toast('Venda registrada e insumos baixados');e.target.reset();render()}
function prevRec(f){const r=rec(f.pid.value),n=+f.q.value,el=$('#prevR');if(!el)return;if(!r||!n){el.textContent='';return}el.textContent='Vai consumir: '+r.itens.map(i=>{const p=prod(i.iid);return fmtN(i.q*n/r.rend)+' '+p.un+' de '+p.nome}).join(', ')+'.'}
function cardRec(){const RC=D.receitas||[];return`<div class="card"><h3>Saída a partir da receita</h3>${RC.length?`<form class="g" onsubmit="baixaRec(event)" oninput="prevRec(this)">${SC}<label>Produto<select name="pid" required>${RC.map(r=>`<option value="${r.pid}">${esc((prod(r.pid)||{nome:'?'}).nome)}</option>`).join('')}</select></label><label>Quantidade vendida<input name="q" type="number" step="any" min="0.001" required></label><label>Observação<input name="obs" placeholder="Opcional"></label><button class="btn gold">Vender e baixar insumos</button></form><p class="empty" id="prevR"></p>`:'<div class="empty">Cadastre uma receita mais abaixo para usar este modo.</div>'}</div>`}
function cardReceitas(){const RC=(D.receitas||[]).filter(r=>prod(r.pid));return`<div class="card"><h3>Receitas</h3>${RC.map(r=>`<div class="alert"><span><b>${esc(prod(r.pid).nome)}</b>, rende ${fmtN(r.rend)} un<br><small style="color:var(--mut)">${r.itens.filter(i=>prod(i.iid)).map(i=>`${fmtN(i.q)} ${prod(i.iid).un} de ${esc(prod(i.iid).nome)}`).join(', ')}. Custo por unidade: R$ ${fmtN(custoRec(r))}.</small></span><button class="btn sm ghost" onclick="delRec('${r.id}')">Excluir</button></div>`).join('')||'<div class="empty">Nenhuma receita cadastrada.</div>'}
<form class="g" onsubmit="novaRec(event)" style="margin-top:14px"><label>Produto pronto<select name="pid" required>${opts(p=>p.tipo==='acabado')}</select></label><label>Rendimento (unidades)<input name="rend" type="number" step="any" min="1" value="1" required></label><div id="ings" style="grid-column:1/-1;display:grid;gap:8px"></div><p class="empty" style="grid-column:1/-1;margin:0">Informe a quantidade na unidade do insumo (kg, L ou un) para o rendimento inteiro. Salvar de novo substitui a receita do produto.</p><button type="button" class="btn ghost" onclick="addIng()">Adicionar ingrediente</button><button class="btn gold">Salvar receita</button></form></div>`}
function addIng(){const b=$('#ings');if(b)b.insertAdjacentHTML('beforeend',`<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><select name="iid" aria-label="Insumo">${opts(p=>p.tipo==='insumo')}</select><input name="iq" type="number" step="any" min="0.001" placeholder="Qtd" aria-label="Quantidade" required></div>`)}
function novaRec(e){e.preventDefault();const fd=new FormData(e.target),iids=fd.getAll('iid'),qs=fd.getAll('iq'),pid=fd.get('pid');
const itens=iids.map((iid,k)=>({iid,q:+qs[k]})).filter(i=>i.q>0);if(!itens.length)return toast('Adicione ao menos um ingrediente.',1);
const old=rec(pid);if(old)delRec(old.id,1);D.receitas.push({id:uid(),pid,rend:+fd.get('rend')||1,itens});save();toast('Receita salva');render()}
function delRec(id,q){D.receitas=D.receitas.filter(r=>r.id!==id);try{if(typeof cloud!=='undefined'&&cloud&&TOKEN)api('/rest/v1/receitas?id=eq.'+id,{method:'DELETE'})}catch(e){}if(!q){save();toast('Receita excluída');render()}}

const BASE=[['pao','Pão francês','Padaria',30,.8,.35],['bolo','Bolo de chocolate','Bolos',2,45,18],['brigadeiro','Brigadeiro gourmet','Doces',20,6.5,2.2],['salgado','Salgado (coxinha)','Salgados',20,6,2.2]];
function garantirBase(){let n=0;BASE.forEach(([k,nome,cat,min,preco,custo])=>{if(!D.produtos.some(p=>nz(p.nome).includes(k))){D.produtos.push({id:uid(),nome,cod:'789'+String(Math.floor(Math.random()*1e7)).padStart(7,'0'),cat,un:'un',min,tipo:'acabado',preco,custo});n++}});if(n)save()}
function novoProd(e){e.preventDefault();const f=new FormData(e.target);
D.produtos.push({id:uid(),nome:f.get('nome').trim(),cod:f.get('cod').trim()||'789'+String(Math.floor(Math.random()*1e7)).padStart(7,'0'),cat:f.get('cat').trim(),un:f.get('un'),min:+f.get('min'),tipo:f.get('tipo'),preco:+f.get('preco')||0,custo:+f.get('custo')||0});
save();toast('Produto cadastrado');render()}
function novoLote(e){e.preventDefault();const f=new FormData(e.target),q=+f.get('q'),v=new Date(f.get('val')).getTime();
if(v<=now())return toast('A validade precisa ser futura.',1);
const l={id:uid(),pid:f.get('pid'),qtd:q,qini:q,val:v,local:f.get('local'),entrada:now()};D.lotes.push(l);mov('entrada',l,q);save();toast('Entrada registrada');render()}
function baixa(e){e.preventDefault();const f=new FormData(e.target),pid=f.get('pid'),q=+f.get('q'),p=prod(pid);
if(!baixaFEFO(pid,q,f.get('tipo'),f.get('obs')))return toast(`Falta de produto: só há ${fmtN(total(pid))} ${p.un} de ${p.nome}.`,1);
toast('Baixa registrada');e.target.reset();render()}
function perda(id){const l=D.lotes.find(x=>x.id===id);mov('perda',l,l.qtd,'vencido');l.qtd=0;save();toast('Perda registrada');render()}
function exportCSV(){const r=[['produto','codigo','categoria','unidade','saldo','minimo']].concat(D.produtos.map(p=>[p.nome,p.cod,p.cat,p.un,total(p.id),p.min]));
const b=new Blob(['\ufeff'+r.map(x=>x.join(';')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='estoque.csv';a.click()}
const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)||h==='lgpd')tab=h;
garantirBase();render();loadClima();setInterval(()=>{loadClima();if(document.activeElement.tagName==='BODY'&&ready())render()},60000);
</script>
